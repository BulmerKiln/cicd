# CodeQL taint analysis with the security-extended queries, one job per language. Results go to
# the repository's code scanning alerts.
#
# java-kotlin is compiled with the build command; every other language, such as
# javascript-typescript or actions, is analyzed from source without a build.

name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        description: >-
          A JSON list of CodeQL languages, such as ["java-kotlin"], ["javascript-typescript"] or
          ["java-kotlin", "actions"].
        type: string
        default: '["java-kotlin"]'
      config-file:
        description: A CodeQL config file in the calling repository, such as paths to ignore.
        type: string
        default: ""
      java-version:
        description: The JDK to build java-kotlin with.
        type: string
        default: "25"
      build-command:
        description: >-
          Compiles every java-kotlin source set. The build cache stays off, so CodeQL sees every
          class being compiled.
        type: string
        default: ./gradlew testClasses --no-daemon --no-build-cache

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
          queries: security-extended
          config-file: ${{ inputs.config-file }}
      - name: Build
        if: matrix.language == 'java-kotlin'
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: $BUILD_COMMAND
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
